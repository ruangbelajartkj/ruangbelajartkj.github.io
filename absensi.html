<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi | RuangKelas TJKT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="shell nav"><a class="brand" href="index.html"><span class="brand-mark">R</span> RuangKelas</a><button class="menu-toggle" type="button" aria-label="Buka menu navigasi" aria-controls="mobile-nav" aria-expanded="false"><span></span><span></span><span></span></button><nav id="mobile-nav" class="nav-links"><a href="materi.html">Materi</a><a href="kuis.html">Kuis</a><a class="nav-active" href="absensi.html">Absensi</a><a href="info.html">Info</a></nav><a class="profile" href="admin.html" aria-label="Login admin"><span class="avatar">AD</span> Admin</a></div></header>
  <main class="shell page-main">
    <section class="page-heading"><div class="eyebrow">Kehadiran siswa</div><h1>Isi absensi</h1><p>Lengkapi nama dan kelas sebelum memulai pembelajaran.</p></section>
    <section class="attendance-card">
      <div class="attendance-intro"><span class="tag">Absensi hari ini</span><h2>Halo, siap belajar?</h2><p>Data absensi akan dicatat setelah kamu mengirim formulir.</p></div>
      <form id="attendance-form" class="attendance-form">
        <label for="attendance-name">Nama lengkap</label>
        <input id="attendance-name" name="nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name" required>
        <label for="attendance-class">Kelas</label>
        <select id="attendance-class" name="kelas" required>
          <option value="">Pilih kelas</option>
          <option value="XI TJKT 1">XI TJKT 1</option>
          <option value="XI TJKT 2">XI TJKT 2</option>
        </select>
        <button class="button" type="submit">Kirim absensi <span>→</span></button>
      </form>
      <div id="attendance-success" class="attendance-success hidden" role="status"></div>
    </section>
  </main>
  <footer><div class="shell">© 2026 RuangKelas TJKT <span style="float:right">Belajar. Praktik. Terhubung.</span></div></footer>
  <script src="script.js"></script>
  <script>
    document.getElementById('attendance-form').addEventListener('submit', async event => {
      event.preventDefault();
      const name = document.getElementById('attendance-name').value.trim();
      const studentClass = document.getElementById('attendance-class').value;
      const success = document.getElementById('attendance-success');
      const submitButton = event.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Mengirim absensi...';
      try {
        await fetch(GOOGLE_SHEETS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'saveAttendance',
            nama: name,
            kelas: studentClass,
            waktu: new Date().toISOString()
          })
        });
        success.textContent = `Absensi ${name} dari kelas ${studentClass} berhasil dikirim.`;
        success.classList.remove('hidden');
        event.target.reset();
      } catch (error) {
        success.textContent = 'Absensi gagal dikirim. Periksa koneksi lalu coba lagi.';
        success.classList.remove('hidden');
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = 'Kirim absensi <span>→</span>';
      }
    });
  </script>
</body>
</html>
